# ──────────────────────────────────────────────────────────────────────
# APEX Terminal — Configuration Schema
# Copy this file to `config/apex.toml` and adjust values.
# All durations use TOML duration-like strings (e.g. "5s", "100ms").
# ──────────────────────────────────────────────────────────────────────

# ── General ──────────────────────────────────────────────────────────

[general]
# Human-readable instance name shown in the title bar.
instance_name = "APEX-Dev"

# Log level: "trace", "debug", "info", "warn", "error"
log_level = "info"

# Where to write structured JSON logs.  Empty string = stdout only.
log_file = "logs/apex.log"

# Data directory for SQLite, model artefacts, and strategy files.
data_dir = "data"

# ── Market Data ──────────────────────────────────────────────────────

[market_data]
# Default market data adapter.  Built-in: "yahoo_finance"
# Community adapters are loaded from `adapters/` directory.
# Public exchange feeds are opt-in: select "binance" or "coinbase" to
# enable that feed on restart. Yahoo remains available for ordinary watchlist
# symbols. Binance accepts pairs such as BTC/USDT; Coinbase uses BTC-USD.
adapter = "yahoo_finance"

# Symbols to subscribe to on startup (watchlist seed).
default_symbols = [
    "RELIANCE.NS",
    "TCS.NS",
    "HDFCBANK.NS",
    "INFY.NS",
    "AAPL",
    "MSFT",
    "GOOGL",
]

# Polling interval for REST-based adapters (ignored by WebSocket feeds).
poll_interval = "5s"

# Maximum number of concurrent symbol subscriptions.
max_subscriptions = 100

# ── Market Data — Yahoo Finance adapter ──────────────────────────────

[market_data.yahoo_finance]
# Base URL (override for proxies or mock servers).
base_url = "https://query1.finance.yahoo.com"

# Request timeout for HTTP calls.
request_timeout = "10s"

# Rate-limit: maximum requests per second.
rate_limit_rps = 5

# ── Execution ────────────────────────────────────────────────────────

[execution]
# Default execution adapter.  Built-in: "paper"
# Use "paper" for simulated trading or implement a broker adapter.
adapter = "paper"

# ── Execution — Paper Trading adapter ────────────────────────────────

[execution.paper]
# Starting capital for the simulated account.
initial_capital = 1_000_000.0

# Currency code (ISO 4217).
currency = "INR"

# Simulated slippage in basis points applied on every fill.
slippage_bps = 2.0

# Simulated commission in basis points applied on every fill.
commission_bps = 3.0

# ── Risk Management ─────────────────────────────────────────────────

[risk]
# Maximum daily loss (absolute value in account currency).
# Trading is halted when session P&L breaches this threshold.
max_daily_loss = 50_000.0

# Maximum single-order notional value.
max_order_value = 500_000.0

# Maximum number of open positions at any time.
max_open_positions = 20

# Maximum position size per symbol (in lots / shares).
max_position_size = 1000

# Cool-down period after a risk halt before manual reset is allowed.
halt_cooldown = "30s"

# ── Circuit Breaker ──────────────────────────────────────────────────

[risk.circuit_breaker]
# Enable automatic circuit breaker on consecutive losses.
enabled = true

# Number of consecutive losing trades to trigger the breaker.
consecutive_loss_limit = 5

# Duration the breaker stays open before allowing new trades.
open_duration = "5m"

# ── Alert Engine ─────────────────────────────────────────────────────

[alerts]
# Maximum number of active alert rules.
max_rules = 50

# How often the alert engine evaluates rules.
evaluation_interval = "1s"

# ── Strategy / Python Sidecar ────────────────────────────────────────

[strategy]
# Path to the Python interpreter (must be ≥ 3.11).
python_path = "python3"

# Directory containing user strategy scripts.
strategies_dir = "strategies"

# Unix domain socket (or named pipe on Windows) for IPC.
ipc_socket = "/tmp/apex_strategy.sock"

# Maximum number of concurrent strategy subprocesses.
max_concurrent = 4

# Maximum restarts before marking a strategy as FAILED.
max_restarts = 3

# Strategy execution deadline warning threshold.
# A warning is emitted if on_bar / on_tick exceeds this duration.
latency_warn_threshold = "1ms"

# ── ML Workbench ─────────────────────────────────────────────────────

[ml]
# Directory for trained model artefacts (joblib + metadata JSON).
models_dir = "models"

# Default number of time-series cross-validation splits.
default_cv_splits = 5

# Lag periods automatically added as features during training.
default_lag_periods = [1, 5, 10]

# ── Storage ──────────────────────────────────────────────────────────

[storage]
# Active storage backend: "sqlite" (local file) or "timescale" / "postgres"
# for a PostgreSQL database with the TimescaleDB extension enabled.
backend = "sqlite"

# SQLite database path (relative to data_dir).
sqlite_path = "apex.db"

# PostgreSQL / TimescaleDB connection URL used when backend = "timescale"
# or "postgres". Example:
# postgresql://postgres:postgres@localhost:5432/apex_market
postgres_url = ""

# Enable WAL mode for better concurrent read performance.
wal_mode = true

# Maximum number of database connections in the pool.
pool_size = 4

# ── Graph Engine ─────────────────────────────────────────────────────

[graph]
# Enable the strategy-symbol relationship graph.
enabled = true

# Maximum number of nodes tracked in the graph.
max_nodes = 500

# Edge weight decay factor applied each tick (0.0–1.0).
weight_decay = 0.99

# ── UI / Tauri ───────────────────────────────────────────────────────

[ui]
# Default window dimensions.
default_width = 1920
default_height = 1080

# Minimum window dimensions.
min_width = 1440
min_height = 900

# Enable hardware-accelerated rendering (disable on older GPUs).
gpu_acceleration = true

# Theme: "dark" (only dark is supported currently).
theme = "dark"

# Command bar activation key.
command_key = "Space"

# ── News Engine ──────────────────────────────────────────────────────

[news]
# Enable RSS/Atom news polling (enabled by default when feeds are listed).
enabled = true

# How often feeds are polled, in seconds.
poll_interval_secs = 300

# Feeds are added with [[news.feeds]] tables. A few liquid, free RSS feeds
# are enabled by default — remove or replace with preferred sources.
[[news.feeds]]
name = "CNBC Markets"
url = "https://www.cnbc.com/id/100003114/device/rss/rss.html"
feed_type = "rss"
priority = 7
enabled = true

[[news.feeds]]
name = "MarketWatch Top Stories"
url = "https://feeds.marketwatch.com/marketwatch/topstories"
feed_type = "rss"
priority = 6
enabled = true

[[news.feeds]]
name = "CoinDesk"
url = "https://www.coindesk.com/arc/outboundfeeds/rss/"
feed_type = "rss"
priority = 5
enabled = true

# ── AI Copilot (OpenRouter) ──────────────────────────────────────────

[copilot]
# Enable the AI copilot panel. Requires the OPEN_ROUTER env var
# (or OPENROUTER_API_KEY) to be set — see .env.example.
enabled = true

# OpenRouter model slug. "openrouter/free" auto-routes to a free model.
model = "openrouter/free"

# OpenRouter API base URL.
base_url = "https://openrouter.ai/api/v1"

# Max tokens per completion.
max_tokens = 1024

# ── Appearance ───────────────────────────────────────────────────────

[appearance]
# "terminal" | "dark" | "light"
theme = "terminal"
# "comfortable" | "compact"
density = "compact"

# ── LLM providers ────────────────────────────────────────────────────
# OpenAI-compatible inference providers the Copilot/agentic loop can use.
# api_kind: "chat" = /chat/completions, "responses" = /responses,
#           "acp" = external agent via the [acp] connector.
# API keys are never stored here — api_key_env names the env var.

[llm]
# Active provider id. Empty = legacy [copilot] config above.
# active = "openrouter"

# Example providers (uncomment to use):
# [[llm.providers]]
# id = "openrouter"
# name = "OpenRouter"
# base_url = "https://openrouter.ai/api/v1"
# model = "openrouter/free"
# api_kind = "chat"
# api_key_env = "OPEN_ROUTER"

# [[llm.providers]]
# id = "openai"
# name = "OpenAI"
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o-mini"
# api_kind = "responses"
# api_key_env = "OPENAI_API_KEY"

# [[llm.providers]]
# id = "local"
# name = "Ollama"
# base_url = "http://localhost:11434/v1"
# model = "llama3.2"
# api_kind = "chat"
# api_key_env = ""

# ── ACP connector ────────────────────────────────────────────────────
# Agent Client Protocol bridge — spawn an external agent (IDE/CLI) and
# talk to it over stdio JSON-RPC (initialize → session/new → prompt).

[acp]
# Command to spawn. Examples:
#   "npx @zed-industries/claude-code-acp"   — Claude Code via ACP
#   "gemini --acp"                          — Gemini CLI ACP mode
# Empty disables the connector.
command = ""

# Working directory for the spawned agent; empty = app data dir.
cwd = ""

# ── Automations ─────────────────────────────────────────────────────
# Scheduled rules that score a trained model on a symbol's latest bar and
# route orders through the risk engine. Managed in-app (Automations tab)
# or by the copilot; persisted to <data_dir>/automations.json.

[automations]
# Master switch for the scheduler.
enabled = true

# When false (default), automation rules and copilot order tools may only
# use the paper broker — live broker ids are rejected.
allow_live_trading = false

# Per-rule daily order cap (reserved; scheduler enforcement).
max_orders_per_day = 100
